<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trip | 智能旅行规划</title>
    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/itinerary.css">
    <link rel="stylesheet" href="css/maps.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&family=Outfit:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
</head>

<body class="dark-theme">
    <header class="navbar">
        <div class="logo" onclick="goDashboard()" style="cursor: pointer;">Smart<span>Trip</span></div>
        <div class="nav-search-bar">
            <span class="material-symbols-outlined">search</span>
            <input type="text" placeholder="Search itineraries..." id="main-search">
        </div>
        <nav>
            <ul>
                <li><a href="#hero">首页</a></li>
                <li><a href="#" onclick="showDashboard()">我的行程</a></li>
                <li><a href="https://google.com/travel" target="_blank">灵感</a></li>
            </ul>
        </nav>
        <div class="nav-right">
            <button class="nav-icon-btn">
                <span class="material-symbols-outlined">notifications</span>
                <span class="nav-dot"></span>
            </button>
            <div class="user-avatar">
                <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAjoN0jmeYMMck49QvhRReRpyFUMWBNKNOgLTI8v4vfAU93GXuQCFDH2qSZbFnILsTz5Kma9z__sMx035_vwxMwphapldySs6-wa2lCwcRkH2HV__E_-F_MtuGPypaQb_GFjrP52_BWn0w2lV1gCEgBNHCcryUksKEBnS0bV0HCh-udwlMkNLJRpJZFd3hTIT8NshkRyUSmXu2zHGSU3OzUBgmBmApUvlzWmUfble9evAzqttWL33_5qyiMEPhedRgvUxV1jOCe5as"
                    alt="User Profile">
            </div>
        </div>
    </header>

    <main id="app-container">
        <!-- Views (Login, Dashboard, Itinerary) will be dynamically injected here by app.js -->
    </main>

    <!-- Global Modal Container -->
    <div id="modal-overlay" class="modal-overlay hidden" onmousedown="if(event.target===this) closeModal()">
        <div class="modal-content">
            <div class="modal-header" style="border-bottom: none; padding-bottom: 0;">
                <h3 id="modal-title" style="text-align:center; width:100%; font-size: 1.2rem;">添加标题</h3>
                <button class="close-btn" onclick="closeModal()"
                    style="position:absolute; right:1.5rem; top:1.2rem; background: var(--glass-bg); padding:0.2rem 0.5rem; border-radius:50%;">&times;</button>
            </div>
            <div id="modal-body" class="modal-body" style="padding-top: 5px;">
                <!-- Dynamic form will be injected here -->
            </div>
        </div>
    </div>

    <!-- Sub Modal Container (For Time, Expense, etc.) -->
    <div id="sub-modal-overlay" class="modal-overlay hidden" style="z-index: 1000;"
        onmousedown="if(event.target===this) closeSubModal()">
        <div class="modal-content sub-modal" style="max-width: 400px;">
            <div class="modal-header" style="border-bottom: none; padding-bottom: 0;">
                <h3 id="sub-modal-title" style="text-align:center; width:100%; font-size: 1.1rem;">添加时间</h3>
                <button class="close-btn" onclick="closeSubModal()"
                    style="position:absolute; right:1.5rem; top:1.2rem; background: var(--glass-bg); padding:0.2rem 0.5rem; border-radius:50%;">&times;</button>
            </div>
            <div id="sub-modal-body" class="modal-body" style="padding-top: 5px;">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/zh.js"></script>
    <!-- Stub: must be defined before Maps API loads (ES modules are deferred) -->
    <script>
        window.initGoogleMaps = function () {
            // Module not ready yet — queue the call
            window._mapsApiReady = true;
            if (typeof window._realInitGoogleMaps === 'function') {
                window._realInitGoogleMaps();
            }
        };
    </script>
    <script type="module" src="js/main.js"></script>
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCmUAhTA7jDkeC4A3R3BtF8QyiNOr0uD8k&libraries=places,geometry,marker&callback=initGoogleMaps&loading=async"
        async defer></script>
</body>

</html>
